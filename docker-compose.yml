version: '3.8'

services:
  # 1. PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: smp_postgres
    restart: always
    environment:
      POSTGRES_USER: smp_user
      POSTGRES_PASSWORD: smp_password_2026
      POSTGRES_DB: smp_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smp_user -d smp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. PgBouncer Connection Pooler (100k+ Concurrency)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: smp_pgbouncer
    restart: always
    environment:
      DB_USER: smp_user
      DB_PASSWORD: smp_password_2026
      DB_HOST: postgres
      DB_NAME: smp_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 10000
      DEFAULT_POOL_SIZE: 50
    ports:
      - '6432:6432'
    depends_on:
      postgres:
        condition: service_healthy

  # 3. Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: smp_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Backend API & Telegram Bot Engine
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: smp_backend
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://smp_user:smp_password_2026@pgbouncer:6432/smp_db?pgbouncer=true"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "prod-super-secret-jwt-key-2026"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      WEBAPP_URL: "${WEBAPP_URL}"
      ADMIN_URL: "${ADMIN_URL}"
    ports:
      - '5000:5000'
    depends_on:
      pgbouncer:
        condition: service_started
      redis:
        condition: service_healthy

  # 5. Telegram Mini App Frontend
  miniapp:
    build:
      context: ./apps/miniapp
      dockerfile: Dockerfile
    container_name: smp_miniapp
    restart: always
    ports:
      - '5173:80'

  # 6. Web Admin Panel Frontend
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: smp_admin
    restart: always
    ports:
      - '5174:80'

  # 7. Master Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smp_nginx
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - miniapp
      - admin

volumes:
  postgres_data:
  redis_data:
